name: Generate Level 1 Quiz Data

on:
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf google-genai tenacity

      - name: Run Level 1 Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python Scripts/generate_level_1.py

      - name: Commit and Push generated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Data/level-1-quiz.json
          git diff-index --quiet HEAD || (git commit -m "auto: update Data/level-1-quiz.json via Gemini" && git push)
