<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Level 1 & 2 Assessment</title>
    <style>
        :root {
            --primary: #4A90E2;
            --primary-dark: #357ABD;
            --success: #2ECC71;
            --error: #E74C3C;
            --background: #F4F7F6;
            --card: #FFFFFF;
            --text: #2C3E50;
            --text-light: #7F8C8D;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .controls-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #E0E0E0;
            outline: none;
            font-size: 0.95rem;
            color: var(--text);
            background-color: #fff;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        .stats {
            display: flex;
            gap: 15px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .stat-box {
            background: #F0F4F8;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #E0E0E0;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        .question-card {
            margin-bottom: 25px;
        }

        .question-tag {
            display: inline-block;
            background: #EBF3FA;
            color: var(--primary-dark);
            font-size: 0.8rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background: #FAFAFA;
            border: 2px solid #EAEAEA;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--primary);
            background-color: #F4F8FC;
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background-color: #E8F8F0;
            border-color: var(--success);
            color: #1E7E34;
            font-weight: 600;
        }

        .option-btn.incorrect {
            background-color: #FCEAE9;
            border-color: var(--error);
            color: #A94442;
        }

        .explanation {
            margin-top: 15px;
            padding: 12px 15px;
            border-radius: 8px;
            background-color: #F8F9FA;
            border-left: 4px solid var(--primary);
            font-size: 0.9rem;
            display: none;
        }

        .footer-nav {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }

        .next-btn:hover {
            background-color: var(--primary-dark);
        }

        .results-screen {
            text-align: center;
            padding: 20px 0;
            display: none;
        }

        .score-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 20px auto;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.4);
        }

        .restart-btn {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }

        .restart-btn:hover {
            background-color: #27AE60;
        }

        canvas#confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

<div class="container">
    <canvas id="confetti"></canvas>
    
    <header>
        <h1>Curso de Español</h1>
        <p class="subtitle">Level 1 & Level 2 Comprehensive Assessment</p>
    </header>

    <div class="controls-panel">
        <select id="lesson-select" onchange="filterQuestions()">
            <option value="all">All Lessons (Level 1 & 2)</option>
            <optgroup label="Level 1">
                <option value="L1_11">L1 Lesson 11: Big/Small & Knowing</option>
                <option value="L1_12">L1 Lesson 12: Locations & States</option>
                <option value="L1_13">L1 Lesson 13: Being, Busy & Tired</option>
                <option value="L1_14">L1 Lesson 14: Demonstratives & Leaving</option>
                <option value="L1_15">L1 Lesson 15: Meals & Certainty</option>
                <option value="L1_16">L1 Lesson 16: Having, Doing & Items</option>
                <option value="L1_17">L1 Lesson 17: Verbs & Subject Pronouns</option>
                <option value="L1_18">L1 Lesson 18: Conjugations & Need</option>
                <option value="L1_19">L1 Lesson 19: Present Tense & Ser/Estar</option>
                <option value="L1_20">L1 Lesson 20: Nationalities & Object Pronouns</option>
            </optgroup>
            <optgroup label="Level 2">
                <option value="L2_12">L2 Lesson 12: Commands & Adverbs</option>
                <option value="L2_13">L2 Lesson 13: Days & Well/Very Well</option>
                <option value="L2_14">L2 Lesson 14: Demonstratives & Nouns</option>
                <option value="L2_15">L2 Lesson 15: "We" Forms & Prepositions</option>
                <option value="L2_16">L2 Lesson 16: Numbers, Rooms & Greetings</option>
                <option value="L2_17">L2 Lesson 17: Giving & Indirect Pronouns</option>
                <option value="L2_18">L2 Lesson 18: Formal Address & Thinking/Starting</option>
                <option value="L2_19">L2 Lesson 19: Liking & Types</option>
                <option value="L2_20">L2 Lesson 20: Ability, Returning & Reflexives</option>
            </optgroup>
        </select>

        <div class="stats">
            <div class="stat-box">Streak: 🔥 <span id="streak-count">0</span></div>
            <div class="stat-box">Score: ⭐ <span id="score-count">0</span></div>
        </div>
    </div>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="quiz-body">
        <div class="question-card">
            <span class="question-tag" id="lesson-tag">Level 1 - Lesson 11</span>
            <div class="question-text" id="question-text">Loading question...</div>
            <div class="options-grid" id="options-container"></div>
            <div class="explanation" id="explanation"></div>
        </div>

        <div class="footer-nav">
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>
        </div>
    </div>

    <div class="results-screen" id="results-screen">
        <h2>Assessment Completed! 🎉</h2>
        <p>Your Final Result:</p>
        <div class="score-circle" id="final-score">0%</div>
        <p id="results-feedback">Great effort! Keep practicing.</p>
        <button class="restart-btn" onclick="restartQuiz()">Try Again 🔄</button>
    </div>
</div>

<script>
// COMPLETE QUESTION BANK FOR LEVEL 1 (11-20) AND LEVEL 2 (12-20)
const rawQuestions = [
    // LEVEL 1 - LESSON 11
    { level: 1, lesson: 11, q: "How do you say 'the big one'?", options: ["el / la grande", "el / la pequeño", "el / la grande uno", "un grande"], answer: 0, exp: "'El / la grande' means the big one." },
    { level: 1, lesson: 11, q: "Translate: 'Do you know why I don't have it?'", options: ["¿Sabes por qué no lo tengo?", "¿Sabes por qué lo tengo?", "¿Quieres saber por qué lo tengo?", "¿Sabes dónde está?"], answer: 0, exp: "'¿Sabes por qué no lo tengo?' is the correct translation." },
    { level: 1, lesson: 11, q: "How do you say 'I know that I can do it'?", options: ["Sé que puedo hacerlo.", "Sé que quiero hacerlo.", "Puedo hacerlo aquí.", "No sé si puedo hacerlo."], answer: 0, exp: "'Sé que puedo hacerlo' = I know that I can do it." },

    // LEVEL 1 - LESSON 12
    { level: 1, lesson: 12, q: "Translate: 'Where are you?'", options: ["¿Dónde estás?", "¿Dónde eres?", "¿Dónde está?", "¿Cómo estás?"], answer: 0, exp: "'¿Dónde estás?' asks for temporary location/state." },
    { level: 1, lesson: 12, q: "How do you say 'here' and 'there'?", options: ["aquí / allí", "allí / aquí", "este / ese", "esto / eso"], answer: 0, exp: "'Aquí' = here; 'Allí' = there." },
    { level: 1, lesson: 12, q: "Translate: 'The hotel is very small.'", options: ["El hotel es muy pequeño.", "La casa es muy grande.", "El hotel está cerca.", "El hotel es grande."], answer: 0, exp: "'El hotel es muy pequeño' translates the statement directly." },

    // LEVEL 1 - LESSON 13
    { level: 1, lesson: 13, q: "How do you say 'I am busy' (female speaker)?", options: ["Estoy ocupado", "Estoy ocupada", "Soy ocupada", "Estoy cansada"], answer: 1, exp: "Feminine adjectives end in -a: 'Estoy ocupada'." },
    { level: 1, lesson: 13, q: "Translate: 'I am tired today' (female speaker).", options: ["Estoy cansada hoy.", "Estoy cansado hoy.", "Soy cansada hoy.", "Tengo cansada hoy."], answer: 0, exp: "'Cansada' reflects a female speaker." },
    { level: 1, lesson: 13, q: "Translate: 'I'm sorry but I'm very busy now' (male speaker).", options: ["Lo siento pero estoy muy ocupado ahora.", "Lo siento pero soy muy ocupado.", "Perdón pero estoy cansado.", "Lo siento pero no puedo."], answer: 0, exp: "'Lo siento pero estoy muy ocupado ahora' is correct." },

    // LEVEL 1 - LESSON 14
    { level: 1, lesson: 14, q: "Translate neutral 'this' and 'that':", options: ["esto / eso", "este / ese", "esta / esa", "el / la"], answer: 0, exp: "'Esto' (this) and 'eso' (that) are neutral demonstrative pronouns." },
    { level: 1, lesson: 14, q: "How do you say 'I have to leave'?", options: ["Tengo que salir.", "Quiero salir.", "Puedo salir.", "Tengo salir."], answer: 0, exp: "'Tengo que' + infinitive = I have to..." },
    { level: 1, lesson: 14, q: "Translate: 'Do you want to leave tonight or tomorrow?'", options: ["¿Quieres salir esta noche o mañana?", "¿Tienes que salir hoy o mañana?", "¿Quieres salir hoy o esta noche?", "¿Puedes salir mañana?"], answer: 0, exp: "'Esta noche' = tonight, 'mañana' = tomorrow." },

    // LEVEL 1 - LESSON 15
    { level: 1, lesson: 15, q: "How do you say 'to have dinner' and 'to have lunch/eat'?", options: ["cenar / comer", "comer / cenar", "tomar / beber", "salir / comer"], answer: 0, exp: "'Cenar' = to have dinner, 'Comer' = to eat/have lunch." },
    { level: 1, lesson: 15, q: "Translate: 'Are you sure that it's possible?' (male listener)", options: ["¿Estás seguro que es posible?", "¿Estás segura que es posible?", "¿Es posible ahora?", "¿Sabes que es posible?"], answer: 0, exp: "'Seguro' is masculine singular." },

    // LEVEL 1 - LESSON 16
    { level: 1, lesson: 16, q: "How do you say 'I do / I am doing'?", options: ["hago", "haces", "hace", "hacemos"], answer: 0, exp: "'Hago' is the 1st person singular present form of hacer." },
    { level: 1, lesson: 16, q: "Translate: 'The computer is on the table.'", options: ["El ordenador / la computadora está en la mesa.", "El teléfono está en la silla.", "La computadora está allí.", "El ordenador está cerca de la mesa."], answer: 0, exp: "'En' translates to 'on' or 'in'." },

    // LEVEL 1 - LESSON 17
    { level: 1, lesson: 17, q: "How do you say 'he knows' and 'she knows'?", options: ["él sabe / ella sabe", "él conoce / ella conoce", "él sabes / ella sabes", "él sabo / ella sabo"], answer: 0, exp: "3rd person singular present of saber is 'sabe'." },
    { level: 1, lesson: 17, q: "Translate: 'Where does he have dinner?'", options: ["¿Dónde cena?", "¿Dónde comes?", "¿Cuándo cena?", "¿Dónde quieres cenar?"], answer: 0, exp: "'¿Dónde cena?' refers to 'he/she/usted'." },

    // LEVEL 1 - LESSON 18
    { level: 1, lesson: 18, q: "How do you say 'I leave' vs 'you leave'?", options: ["salgo / sales", "sale / salgo", "salgo / sale", "salir / sales"], answer: 0, exp: "'Yo salgo' (I leave), 'Tú sales' (you leave)." },
    { level: 1, lesson: 18, q: "Translate: 'She needs to do it.'", options: ["Necesita hacerlo.", "Necesitas hacerlo.", "Necesito hacerlo.", "Quiere hacerlo."], answer: 0, exp: "'Necesita hacerlo' = He/She/Usted needs to do it." },

    // LEVEL 1 - LESSON 19
    { level: 1, lesson: 19, q: "How do you say 'I see' and 'you see'?", options: ["veo / ves", "veo / ve", "ves / veo", "ver / ves"], answer: 0, exp: "'Yo veo' (I see), 'Tú ves' (you see)." },
    { level: 1, lesson: 19, q: "Translate: 'She can leave when she wants.'", options: ["Puede salir cuando quiere.", "Quieres salir cuando puedes.", "Puedo salir cuando quiero.", "Puede salir hoy."], answer: 0, exp: "'Puede salir cuando quiere' translates the full phrase." },

    // LEVEL 1 - LESSON 20
    { level: 1, lesson: 20, q: "How do you say 'I am British'?", options: ["Soy británico/a.", "Estoy británico/a.", "Eres británico.", "Es británico."], answer: 0, exp: "Use 'ser' (Soy) for nationality." },
    { level: 1, lesson: 20, q: "Translate: 'Can you see me?' and 'I can see you.'", options: ["¿Puedes verme? / Puedo verte.", "¿Puedes verte? / Puedo verme.", "¿Me ves? / Te ves.", "¿Puedes ver / Puedo ver?"], answer: 0, exp: "'Me' = me, 'Te' = you (object pronouns attached to infinitives)." },

    // LEVEL 2 - LESSON 12
    { level: 2, lesson: 12, q: "How do you say 'to call' in Spanish?", options: ["llamar", "hablar", "poner", "hacer"], answer: 0, exp: "'Llamar' means to call." },
    { level: 2, lesson: 12, q: "Translate the command: 'Call me!'", options: ["¡Llámalo!", "¡Llámame!", "¡Llámala!", "¡Háblame!"], answer: 1, exp: "Imperative 'llamar' + 'me' = ¡Llámame!" },
    { level: 2, lesson: 12, q: "Translate the command: 'Buy it!' (masculine)", options: ["¡Cómprala!", "¡Hazlo!", "¡Cómpralo!", "¡Ponlo!"], answer: 2, exp: "Imperative 'comprar' + 'lo' = ¡Cómpralo!" },
    { level: 2, lesson: 12, q: "How do you say 'fast / quickly'?", options: ["despacio", "pronto", "rápido", "tarde"], answer: 2, exp: "'Rápido' means fast or quickly." },

    // LEVEL 2 - LESSON 13
    { level: 2, lesson: 13, q: "How do you say 'well' and 'very well'?", options: ["bueno / muy bueno", "bien / muy bien", "malo / muy malo", "listo / muy listo"], answer: 1, exp: "'Bien' = well, 'muy bien' = very well." },
    { level: 2, lesson: 13, q: "Translate: 'Monday'", options: ["el martes", "el lunes", "el jueves", "el domingo"], answer: 1, exp: "Monday is 'el lunes'." },
    { level: 2, lesson: 13, q: "Translate: 'Wednesday'", options: ["el jueves", "el miércoles", "el lunes", "el domingo"], answer: 1, exp: "Wednesday is 'el miércoles'." },

    // LEVEL 2 - LESSON 14
    { level: 2, lesson: 14, q: "How do you say 'this' (masculine & feminine with nouns)?", options: ["ese / esa", "este / esta", "esto / eso", "aquel / aquella"], answer: 1, exp: "'Este' (m.) and 'esta' (f.) mean 'this'." },
    { level: 2, lesson: 14, q: "How do you say 'a man' and 'a woman'?", options: ["un chico / una chica", "un hombre / una mujer", "un señor / una señora", "un amigo / una amiga"], answer: 1, exp: "'Un hombre' (a man), 'una mujer' (a woman)." },

    // LEVEL 2 - LESSON 15
    { level: 2, lesson: 15, q: "What pronoun is used for 'we' in Spanish?", options: ["nosotros / nosotras", "ellos / ellas", "ustedes", "vosotros"], answer: 0, exp: "'Nosotros' (m./mixed) and 'nosotras' (f.) mean 'we'." },
    { level: 2, lesson: 15, q: "How do you say 'we speak'?", options: ["hablan", "hablamos", "habláis", "hablo"], answer: 1, exp: "The 'we' ending for -ar verbs is -amos: habl-amos." },

    // LEVEL 2 - LESSON 16
    { level: 2, lesson: 16, q: "How do you say 'too / too much' in Spanish?", options: ["mucho", "demasiado", "muy", "bastante"], answer: 1, exp: "'Demasiado' means too or too much." },
    { level: 2, lesson: 16, q: "Count 1 to 5 in Spanish:", options: ["seis, siete, ocho, nueve, diez", "uno, dos, tres, cuatro, cinco", "primero, segundo, tercero, cuarto, quinto", "un, dos, tres, catorce, quince"], answer: 1, exp: "1 to 5: uno, dos, tres, cuatro, cinco." },

    // LEVEL 2 - LESSON 17
    { level: 2, lesson: 17, q: "How do you say 'to give' in Spanish?", options: ["dar", "decir", "deber", "dejar"], answer: 0, exp: "'Dar' means to give." },
    { level: 2, lesson: 17, q: "Translate: 'Give me!'", options: ["¡Dames!", "¡Dame!", "¡Darte!", "¡Dalo!"], answer: 1, exp: "'¡Dame!' is imperative 'give me'." },

    // LEVEL 2 - LESSON 18
    { level: 2, lesson: 18, q: "What is the formal word for 'you' in Spanish?", options: ["tú", "usted", "ustedes", "vosotros"], answer: 1, exp: "'Usted' is the formal singular 'you'." },
    { level: 2, lesson: 18, q: "How do you say 'to start / to begin'?", options: ["empezar", "pensar", "poner", "poder"], answer: 0, exp: "'Empezar' means to start." },

    // LEVEL 2 - LESSON 19
    { level: 2, lesson: 19, q: "How do you ask 'what kind of...?'", options: ["¿cuántos tipo de...?", "¿qué tipo de...?", "¿cuál tipo de...?", "¿cómo tipo de...?"], answer: 1, exp: "'¿Qué tipo de...?' translates to 'what kind/type of...?'" },
    { level: 2, lesson: 19, q: "How do you say 'I like' vs 'I would like'?", options: ["me gustaría / me gusta", "me gusta / me gustaría", "quiero / me gustaría", "me gusta / me quiero"], answer: 1, exp: "'Me gusta' = I like; 'Me gustaría' = I would like." },

    // LEVEL 2 - LESSON 20
    { level: 2, lesson: 20, q: "How do you say 'to be able / can'?", options: ["poder", "poner", "pedir", "pensar"], answer: 0, exp: "'Poder' means to be able / can." },
    { level: 2, lesson: 20, q: "How do you say 'I am getting up' (lifting myself)?", options: ["Lo levanto", "Me levanto", "Te levantas", "Se levanta"], answer: 1, exp: "Reflexive form: 'Me levanto' = I get up." }
];

// STATE MANAGEMENT
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let streak = 0;

// WEB AUDIO SYNTHESIZER FOR SFX
let audioCtx = null;

function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

function playSound(type) {
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, ctx.currentTime);
            osc.frequency.setValueAtTime(174.61, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        }
    } catch(e) {
        // Fallback gracefully if Web Audio API is blocked
    }
}

// INITIALIZATION & FILTERING
function filterQuestions() {
    const selected = document.getElementById('lesson-select').value;
    if (selected === 'all') {
        currentQuestions = [...rawQuestions];
    } else {
        const [lvl, lsn] = selected.split('_');
        currentQuestions = rawQuestions.filter(q => q.level === parseInt(lvl.replace('L','')) && q.lesson === parseInt(lsn));
    }
    
    // Shuffle questions
    currentQuestions.sort(() => Math.random() - 0.5);
    
    restartQuiz();
}

function restartQuiz() {
    currentIndex = 0;
    score = 0;
    streak = 0;
    document.getElementById('score-count').textContent = score;
    document.getElementById('streak-count').textContent = streak;
    document.getElementById('results-screen').style.display = 'none';
    document.getElementById('quiz-body').style.display = 'block';
    showQuestion();
}

function showQuestion() {
    const qData = currentQuestions[currentIndex];
    
    // UI Update
    document.getElementById('lesson-tag').textContent = `Level ${qData.level} - Lesson ${qData.lesson}`;
    document.getElementById('question-text').textContent = qData.q;
    document.getElementById('explanation').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    
    // Progress Bar Update
    const progressPct = (currentIndex / currentQuestions.length) * 100;
    document.getElementById('progress-bar').style.width = `${progressPct}%`;

    // Render Options
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';
    
    qData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
    });
}

function selectOption(index) {
    const qData = currentQuestions[currentIndex];
    const options = document.querySelectorAll('.option-btn');
    
    options.forEach(btn => btn.disabled = true);

    if (index === qData.answer) {
        options[index].classList.add('correct');
        score++;
        streak++;
        playSound('correct');
    } else {
        options[index].classList.add('incorrect');
        options[qData.answer].classList.add('correct');
        streak = 0;
        playSound('error');
    }

    document.getElementById('score-count').textContent = score;
    document.getElementById('streak-count').textContent = streak;

    const expBox = document.getElementById('explanation');
    expBox.textContent = `💡 ${qData.exp}`;
    expBox.style.display = 'block';

    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        showQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quiz-body').style.display = 'none';
    document.getElementById('progress-bar').style.width = '100%';
    
    const resultsScreen = document.getElementById('results-screen');
    const finalPct = Math.round((score / currentQuestions.length) * 100);
    
    document.getElementById('final-score').textContent = `${finalPct}%`;
    
    let feedback = "";
    if (finalPct === 100) feedback = "¡Excelente! You have mastered all selected material! 🌟";
    else if (finalPct >= 80) feedback = "¡Muy bien! Great vocabulary retention! 👏";
    else if (finalPct >= 60) feedback = "Good attempt! Review the lessons and try again. 👍";
    else feedback = "Keep practicing! Consistency is key. 📚";
    
    document.getElementById('results-feedback').textContent = feedback;
    resultsScreen.style.display = 'block';

    if (finalPct >= 80) {
        triggerConfetti();
    }
}

function triggerConfetti() {
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;

    const pieces = [];
    const colors = ['#4A90E2', '#2ECC71', '#E74C3C', '#F1C40F', '#9B59B6'];

    for (let i = 0; i < 80; i++) {
        pieces.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 8 + 4,
            speed: Math.random() * 3 + 2
        });
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
            p.y += p.speed;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });

        if (pieces.some(p => p.y < canvas.height)) {
            requestAnimationFrame(animate);
        }
    }
    animate();
}

// Start Quiz on initial page load
filterQuestions();
</script>
