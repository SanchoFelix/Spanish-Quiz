<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Level 1 & 2 Advanced Challenge Quiz</title>
    <style>
        :root {
            --primary: #4A90E2;
            --primary-dark: #357ABD;
            --success: #2ECC71;
            --error: #E74C3C;
            --background: #F4F7F6;
            --card: #FFFFFF;
            --text: #2C3E50;
            --text-light: #7F8C8D;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .controls-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #E0E0E0;
            outline: none;
            font-size: 0.95rem;
            color: var(--text);
            background-color: #fff;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        .stats {
            display: flex;
            gap: 15px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .stat-box {
            background: #F0F4F8;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #E0E0E0;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        .question-card {
            margin-bottom: 25px;
        }

        .question-tag {
            display: inline-block;
            background: #EBF3FA;
            color: var(--primary-dark);
            font-size: 0.8rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .input-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .user-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #EAEAEA;
            border-radius: 8px;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .user-input:focus {
            border-color: var(--primary);
        }

        .user-input.correct {
            background-color: #E8F8F0;
            border-color: var(--success);
            color: #1E7E34;
            font-weight: 600;
        }

        .user-input.incorrect {
            background-color: #FCEAE9;
            border-color: var(--error);
            color: #A94442;
        }

        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: var(--primary-dark);
        }

        .explanation {
            margin-top: 15px;
            padding: 12px 15px;
            border-radius: 8px;
            background-color: #F8F9FA;
            border-left: 4px solid var(--primary);
            font-size: 0.95rem;
            display: none;
        }

        .footer-nav {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }

        .next-btn:hover {
            background-color: var(--primary-dark);
        }

        .results-screen {
            text-align: center;
            padding: 20px 0;
            display: none;
        }

        .score-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 20px auto;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.4);
        }

        .restart-btn {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }

        .restart-btn:hover {
            background-color: #27AE60;
        }

        canvas#confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

<div class="container">
    <canvas id="confetti"></canvas>
    
    <header>
        <h1>Curso de Español: Advanced Practice</h1>
        <p class="subtitle">Fill-in-the-Blank & Sentence Completion Assessment</p>
    </header>

    <div class="controls-panel">
        <select id="lesson-select" onchange="filterQuestions()">
            <option value="all">All Lessons (Level 1 & 2)</option>
            <optgroup label="Level 1">
                <option value="L1_11">L1 Lesson 11: Big/Small & Knowing</option>
                <option value="L1_12">L1 Lesson 12: Locations & States</option>
                <option value="L1_13">L1 Lesson 13: Being, Busy & Tired</option>
                <option value="L1_14">L1 Lesson 14: Demonstratives & Leaving</option>
                <option value="L1_15">L1 Lesson 15: Meals & Certainty</option>
                <option value="L1_16">L1 Lesson 16: Having, Doing & Items</option>
                <option value="L1_17">L1 Lesson 17: Verbs & Subject Pronouns</option>
                <option value="L1_18">L1 Lesson 18: Conjugations & Need</option>
                <option value="L1_19">L1 Lesson 19: Present Tense & Ser/Estar</option>
                <option value="L1_20">L1 Lesson 20: Nationalities & Object Pronouns</option>
            </optgroup>
            <optgroup label="Level 2">
                <option value="L2_12">L2 Lesson 12: Commands & Adverbs</option>
                <option value="L2_13">L2 Lesson 13: Days & Well/Very Well</option>
                <option value="L2_14">L2 Lesson 14: Demonstratives & Nouns</option>
                <option value="L2_15">L2 Lesson 15: "We" Forms & Prepositions</option>
                <option value="L2_16">L2 Lesson 16: Numbers, Rooms & Greetings</option>
                <option value="L2_17">L2 Lesson 17: Giving & Indirect Pronouns</option>
                <option value="L2_18">L2 Lesson 18: Formal Address & Thinking/Starting</option>
                <option value="L2_19">L2 Lesson 19: Liking & Types</option>
                <option value="L2_20">L2 Lesson 20: Ability, Returning & Reflexives</option>
            </optgroup>
        </select>

        <div class="stats">
            <div class="stat-box">Streak: 🔥 <span id="streak-count">0</span></div>
            <div class="stat-box">Score: ⭐ <span id="score-count">0</span></div>
        </div>
    </div>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="quiz-body">
        <div class="question-card">
            <span class="question-tag" id="lesson-tag">Level 1 - Lesson 11</span>
            <div class="question-text" id="question-text">Loading question...</div>
            
            <div class="input-container">
                <input type="text" id="user-answer" class="user-input" placeholder="Type your Spanish answer here..." autocomplete="off">
                <button id="submit-btn" class="submit-btn" onclick="checkAnswer()">Submit Answer</button>
            </div>

            <div class="explanation" id="explanation"></div>
        </div>

        <div class="footer-nav">
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>
        </div>
    </div>

    <div class="results-screen" id="results-screen">
        <h2>Assessment Completed! 🎉</h2>
        <p>Your Final Result:</p>
        <div class="score-circle" id="final-score">0%</div>
        <p id="results-feedback">Great effort! Keep practicing.</p>
        <button class="restart-btn" onclick="restartQuiz()">Try Again 🔄</button>
    </div>
</div>

<script>
// ADVANCED FILL-IN-THE-BLANK / COMPLETE THE SENTENCE QUESTION BANK
// Array of valid answers accepts common variations and regional terms (e.g., ordenador / computadora)
const rawQuestions = [
    // LEVEL 1 - LESSON 11
    { level: 1, lesson: 11, q: "Fill in the blank: Fill in the missing Spanish word for 'the big one' (masculine):\n'¿Quieres el pequeño o _____ grande?'", answers: ["el"], exp: "Use 'el' for 'the big one' (masculine) -> el grande." },
    { level: 1, lesson: 11, q: "Complete the sentence (Translate 'why I don't have it'):\n¿Sabes _____ _____ _____ _____?", answers: ["por que no lo tengo", "porque no lo tengo"], exp: "'Por qué no lo tengo' = why I don't have it." },
    { level: 1, lesson: 11, q: "Fill in the blank (Translate 'I know that I can do it'):\n'_____ que puedo hacerlo.'", answers: ["se", "sé"], exp: "'Sé' is 1st person singular of saber." },

    // LEVEL 1 - LESSON 12
    { level: 1, lesson: 12, q: "Complete the sentence (Translate 'Where are you?'):\n¿Dónde _____?", answers: ["estas", "estás"], exp: "'Estás' is used for asking location of 'tú'." },
    { level: 1, lesson: 12, q: "Fill in the blank (Translate 'here' and 'there'):\n'Está _____ (here), no está _____ (there).'", answers: ["aqui alli", "aquí allí", "aqui, alli", "aquí, allí"], exp: "'Aquí' means here, 'allí' means there." },

    // LEVEL 1 - LESSON 13
    { level: 1, lesson: 13, q: "Complete the sentence (Translate 'I am busy' - female speaker):\n'Estoy _____.'", answers: ["ocupada"], exp: "Female speaker uses feminine adjective ending (-a): ocupada." },
    { level: 1, lesson: 13, q: "Fill in the blank (Translate 'tired today' - female speaker):\n'Estoy _____ hoy.'", answers: ["cansada"], exp: "Feminine form of tired is 'cansada'." },

    // LEVEL 1 - LESSON 14
    { level: 1, lesson: 14, q: "Fill in the blank (Translate neutral 'this' and 'that'):\n'¿Qué es _____ (this)? ¿Qué es _____ (that)?'", answers: ["esto eso", "esto, eso", "esto y eso"], exp: "Neutral demonstratives: esto (this), eso (that)." },
    { level: 1, lesson: 14, q: "Complete the sentence (Translate 'I have to leave'):\n'_____ que salir.'", answers: ["tengo"], exp: "'Tengo que salir' = I have to leave." },

    // LEVEL 1 - LESSON 15
    { level: 1, lesson: 15, q: "Fill in the blank (Translate 'to have dinner' and 'to have lunch/eat'):\n'Quiero _____ (have dinner) y luego _____ (eat/lunch).'", answers: ["cenar comer", "cenar, comer", "cenar y comer"], exp: "'Cenar' = to have dinner; 'Comer' = to eat / have lunch." },
    { level: 1, lesson: 15, q: "Complete the sentence (Translate 'Are you sure that it's possible?' - masculine listener):\n¿Estás _____ que es posible?", answers: ["seguro"], exp: "Masculine form: seguro." },

    // LEVEL 1 - LESSON 16
    { level: 1, lesson: 16, q: "Complete the sentence (Translate 'I do / I am doing it today'):\n'Lo _____ hoy.'", answers: ["hago"], exp: "1st person present form of hacer is 'hago'." },
    { level: 1, lesson: 16, q: "Fill in the blank (Translate 'The computer is on the table'):\n'El ordenador / la computadora está _____ la mesa.'", answers: ["en"], exp: "'En' translates to 'on' or 'in'." },

    // LEVEL 1 - LESSON 17
    { level: 1, lesson: 17, q: "Complete the sentence (Translate 'He knows why'):\n'Él _____ por qué.'", answers: ["sabe"], exp: "3rd person singular present of saber is 'sabe'." },
    { level: 1, lesson: 17, q: "Fill in the blank (Translate 'Where does he have dinner?'):\n'¿Dónde _____?'", answers: ["cena"], exp: "Present conjugation for he/she/usted: cena." },

    // LEVEL 1 - LESSON 18
    { level: 1, lesson: 18, q: "Fill in the blank (Translate 'I leave' and 'you leave'):\n'Yo _____ (leave), tú _____ (leave).'", answers: ["salgo sales", "salgo, sales", "salgo y sales"], exp: "Conjugation of salir: salgo, sales." },
    { level: 1, lesson: 18, q: "Complete the sentence (Translate 'She needs to do it'):\n'_____ hacerlo.'", answers: ["necesita", "ella necesita"], exp: "'Necesita' translates to she/he needs." },

    // LEVEL 1 - LESSON 19
    { level: 1, lesson: 19, q: "Fill in the blank (Translate 'I see' and 'you see'):\n'Yo _____ (see), tú _____ (see).'", answers: ["veo ves", "veo, ves", "veo y ves"], exp: "Conjugation of ver: veo, ves." },

    // LEVEL 1 - LESSON 20
    { level: 1, lesson: 20, q: "Complete the sentence (Translate 'I am British' - male/female speaker):\n'_____ británico/a.'", answers: ["soy"], exp: "Use 'Soy' for nationality." },
    { level: 1, lesson: 20, q: "Fill in the blank (Translate 'Can you see me?' and 'I can see you'):\n'¿Puedes ver_____? Puedo ver_____.'", answers: ["me te", "me, te", "me / te"], exp: "Object pronouns attached to infinitives: verme, verte." },

    // LEVEL 2 - LESSON 12
    { level: 2, lesson: 12, q: "Complete the command (Translate 'Call me!'):\n'¡Lláma_____!'", answers: ["me", "llámame"], exp: "Informal imperative of llamar + me = ¡Llámame!" },
    { level: 2, lesson: 12, q: "Complete the command (Translate 'Buy it!' - masculine object):\n'¡Cómpra_____!'", answers: ["lo", "cómpralo"], exp: "Imperative comprar + lo = ¡Cómpralo!" },

    // LEVEL 2 - LESSON 13
    { level: 2, lesson: 13, q: "Fill in the blank (Translate 'well' and 'very well'):\n'Habla _____ (well), habla _____ _____ (very well).'", answers: ["bien muy bien", "bien, muy bien"], exp: "'Bien' = well, 'muy bien' = very well." },
    { level: 2, lesson: 13, q: "Fill in the blank with the Spanish day of the week:\n'Monday = el _____ , Wednesday = el _____.'", answers: ["lunes miercoles", "lunes miércoles", "lunes, miercoles", "lunes, miércoles"], exp: "Monday = lunes, Wednesday = miércoles." },

    // LEVEL 2 - LESSON 14
    { level: 2, lesson: 14, q: "Fill in the blank (Translate 'this book' and 'that table'):\n'_____ libro (this), _____ mesa (that).'", answers: ["este esa", "este, esa"], exp: "Demonstrative adjectives: este (m. this), esa (f. that)." },
    { level: 2, lesson: 14, q: "Complete the sentence (Translate 'a man and a woman'):\n'Un _____ y una _____.'", answers: ["hombre mujer", "hombre, mujer", "hombre y una mujer"], exp: "'Hombre' = man, 'mujer' = woman." },

    // LEVEL 2 - LESSON 15
    { level: 2, lesson: 15, q: "Complete the sentence (Translate 'We speak'):\n'Nosotros _____.'", answers: ["hablamos"], exp: "The -ar verb ending for 'nosotros' is -amos." },
    { level: 2, lesson: 15, q: "Complete the sentence (Translate 'We go out / leave'):\n'Nosotros _____.'", answers: ["salimos"], exp: "The -ir verb ending for 'nosotros' is -imos: salimos." },

    // LEVEL 2 - LESSON 16
    { level: 2, lesson: 16, q: "Complete the sentence (Translate 'It is too expensive / too much'):\n'Es _____ caro.'", answers: ["demasiado"], exp: "'Demasiado' means too or too much." },
    { level: 2, lesson: 16, q: "Fill in the blank (Count 1 to 3 in Spanish):\n'_____, dos, _____.'", answers: ["uno tres", "uno, tres"], exp: "1 = uno, 3 = tres." },

    // LEVEL 2 - LESSON 17
    { level: 2, lesson: 17, q: "Complete the command (Translate 'Give me!'):\n'¡Da_____!'", answers: ["me", "dame"], exp: "Imperative form of dar + me = ¡Dame!" },
    { level: 2, lesson: 17, q: "Fill in the blank (Translate 'You give me' vs 'I give you'):\n'Me _____ (you give me), te _____ (I give you).'", answers: ["das doy", "das, doy"], exp: "Conjugations of dar: (tú) das, (yo) doy." },

    // LEVEL 2 - LESSON 18
    { level: 2, lesson: 18, q: "Complete the sentence (Translate 'How are you?' formally using usted):\n¿Cómo _____ usted?", answers: ["esta", "está"], exp: "Use 3rd person singular for formal address: está." },
    { level: 2, lesson: 18, q: "Complete the sentence (Translate 'I start / begin'):\n'Yo _____.'", answers: ["empiezo"], exp: "Stem-changing verb: empezar -> empiezo." },

    // LEVEL 2 - LESSON 19
    { level: 2, lesson: 19, q: "Complete the question (Translate 'What kind of...'):\n¿_____ tipo de...?", answers: ["que", "qué"], exp: "'¿Qué tipo de...?' = What kind of..." },
    { level: 2, lesson: 19, q: "Fill in the blank (Translate 'I like' vs 'I would like'):\n'Me _____ (I like), me _____ (I would like).'", answers: ["gusta gustaria", "gusta gustaría", "gusta, gustaria", "gusta, gustaría"], exp: "'Me gusta' = I like; 'Me gustaría' = I would like." },

    // LEVEL 2 - LESSON 20
    { level: 2, lesson: 20, q: "Complete the sentence (Translate 'I can / am able'):\n'Yo _____ hacerlo.'", answers: ["puedo"], exp: "Stem-changing verb: poder -> puedo." },
    { level: 2, lesson: 20, q: "Complete the sentence (Translate 'I am getting up'):\n'_____ levanto.'", answers: ["me"], exp: "Reflexive pronoun for 'yo': me levanto." }
];

// STATE MANAGEMENT
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let streak = 0;

// WEB AUDIO SYNTHESIZER
let audioCtx = null;

function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

function playSound(type) {
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, ctx.currentTime);
            osc.frequency.setValueAtTime(174.61, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        }
    } catch(e) {}
}

// INITIALIZATION & FILTERING
function filterQuestions() {
    const selected = document.getElementById('lesson-select').value;
    if (selected === 'all') {
        currentQuestions = [...rawQuestions];
    } else {
        const [lvl, lsn] = selected.split('_');
        currentQuestions = rawQuestions.filter(q => q.level === parseInt(lvl.replace('L','')) && q.lesson === parseInt(lsn));
    }
    
    currentQuestions.sort(() => Math.random() - 0.5);
    restartQuiz();
}

function restartQuiz() {
    currentIndex = 0;
    score = 0;
    streak = 0;
    document.getElementById('score-count').textContent = score;
    document.getElementById('streak-count').textContent = streak;
    document.getElementById('results-screen').style.display = 'none';
    document.getElementById('quiz-body').style.display = 'block';
    showQuestion();
}

function showQuestion() {
    const qData = currentQuestions[currentIndex];
    
    document.getElementById('lesson-tag').textContent = `Level ${qData.level} - Lesson${qData.lesson}`;
    document.getElementById('question-text').innerText = qData.q;
    document.getElementById('explanation').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    
    const inputField = document.getElementById('user-answer');
    const submitBtn = document.getElementById('submit-btn');
    inputField.value = '';
    inputField.disabled = false;
    inputField.className = 'user-input';
    submitBtn.disabled = false;
    submitBtn.style.display = 'block';

    // Focus input field automatically
    setTimeout(() => inputField.focus(), 100);

    // Keypress handler for enter key
    inputField.onkeyup = function(e) {
        if (e.key === 'Enter') checkAnswer();
    };
    
    const progressPct = (currentIndex / currentQuestions.length) * 100;
    document.getElementById('progress-bar').style.width = `${progressPct}%`;
}

// STRING NORMALIZATION UTILITY (Ignores punctuation, accents, and case for friendly matching)
function normalizeString(str) {
    return str
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // remove accents
        .replace(/[¿?¡!.,\/#$%\^&\*;:{}=\-_`~()]/g, "") // remove punctuation
        .replace(/\s+/g, " ") // simplify whitespace
        .trim();
}

function checkAnswer() {
    const qData = currentQuestions[currentIndex];
    const inputField = document.getElementById('user-answer');
    const submitBtn = document.getElementById('submit-btn');
    const userVal = normalizeString(inputField.value);
    
    if (!userVal) return; // Ignore blank submissions

    inputField.disabled = true;
    submitBtn.style.display = 'none';

    // Check if normalized user input matches any acceptable normalized answer
    const isCorrect = qData.answers.some(ans => normalizeString(ans) === userVal);

    if (isCorrect) {
        inputField.classList.add('correct');
        score++;
        streak++;
        playSound('correct');
    } else {
        inputField.classList.add('incorrect');
        streak = 0;
        playSound('error');
    }

    document.getElementById('score-count').textContent = score;
    document.getElementById('streak-count').textContent = streak;

    const expBox = document.getElementById('explanation');
    expBox.innerHTML = `<strong>Accepted Answer:</strong> ${qData.answers[0]}<br>💡 ${qData.exp}`;
    expBox.style.display = 'block';

    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        showQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quiz-body').style.display = 'none';
    document.getElementById('progress-bar').style.width = '100%';
    
    const resultsScreen = document.getElementById('results-screen');
    const finalPct = Math.round((score / currentQuestions.length) * 100);
    
    document.getElementById('final-score').textContent = `${finalPct}%`;
    
    let feedback = "";
    if (finalPct === 100) feedback = "¡Increíble! Perfect score on advanced recall! 🌟";
    else if (finalPct >= 80) feedback = "¡Excelente! Superior active grammar memory! 👏";
    else if (finalPct >= 60) feedback = "Good effort! Practice spelling and conjugations again. 👍";
    else feedback = "Keep practicing! Active recall builds true fluency. 📚";
    
    document.getElementById('results-feedback').textContent = feedback;
    resultsScreen.style.display = 'block';

    if (finalPct >= 80) {
        triggerConfetti();
    }
}

function triggerConfetti() {
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;

    const pieces = [];
    const colors = ['#4A90E2', '#2ECC71', '#E74C3C', '#F1C40F', '#9B59B6'];

    for (let i = 0; i < 80; i++) {
        pieces.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 8 + 4,
            speed: Math.random() * 3 + 2
        });
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
            p.y += p.speed;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });

        if (pieces.some(p => p.y < canvas.height)) {
            requestAnimationFrame(animate);
        }
    }
    animate();
}

// Start Quiz on load
filterQuestions();
