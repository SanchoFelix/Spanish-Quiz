<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Level 1 & 2 Full Sentence Translation Challenge</title>
    <style>
        :root {
            --primary: #4A90E2;
            --primary-dark: #357ABD;
            --success: #2ECC71;
            --error: #E74C3C;
            --background: #F4F7F6;
            --card: #FFFFFF;
            --text: #2C3E50;
            --text-light: #7F8C8D;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .controls-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #E0E0E0;
            outline: none;
            font-size: 0.95rem;
            color: var(--text);
            background-color: #fff;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        .stats {
            display: flex;
            gap: 15px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .stat-box {
            background: #F0F4F8;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #E0E0E0;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        .question-card {
            margin-bottom: 25px;
        }

        .question-tag {
            display: inline-block;
            background: #EBF3FA;
            color: var(--primary-dark);
            font-size: 0.8rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .input-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        textarea.user-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #EAEAEA;
            border-radius: 8px;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
            resize: vertical;
            min-height: 80px;
        }

        textarea.user-input:focus {
            border-color: var(--primary);
        }

        textarea.user-input.correct {
            background-color: #E8F8F0;
            border-color: var(--success);
            color: #1E7E34;
            font-weight: 600;
        }

        textarea.user-input.incorrect {
            background-color: #FCEAE9;
            border-color: var(--error);
            color: #A94442;
        }

        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: var(--primary-dark);
        }

        .explanation {
            margin-top: 15px;
            padding: 14px 16px;
            border-radius: 8px;
            background-color: #F8F9FA;
            border-left: 4px solid var(--primary);
            font-size: 0.95rem;
            display: none;
            line-height: 1.5;
        }

        .accepted-list {
            margin-top: 6px;
            padding-left: 20px;
            color: #2C3E50;
        }

        .footer-nav {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }

        .next-btn:hover {
            background-color: var(--primary-dark);
        }

        .results-screen {
            text-align: center;
            padding: 20px 0;
            display: none;
        }

        .score-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 20px auto;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.4);
        }

        .restart-btn {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }

        .restart-btn:hover {
            background-color: #27AE60;
        }

        canvas#confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

<div class="container">
    <canvas id="confetti"></canvas>
    
    <header>
        <h1>Curso de Español: Hard Mode</h1>
        <p class="subtitle">Full-Sentence Active Recall & Translation Assessment</p>
    </header>

    <div class="controls-panel">
        <select id="lesson-select" onchange="filterQuestions()">
            <option value="all">All Lessons (Level 1 & 2)</option>
            <optgroup label="Level 1">
                <option value="L1_11">L1 Lesson 11: Big/Small & Knowing</option>
                <option value="L1_12">L1 Lesson 12: Locations & States</option>
                <option value="L1_13">L1 Lesson 13: Being, Busy & Tired</option>
                <option value="L1_14">L1 Lesson 14: Demonstratives & Leaving</option>
                <option value="L1_15">L1 Lesson 15: Meals & Certainty</option>
                <option value="L1_16">L1 Lesson 16: Having, Doing & Items</option>
                <option value="L1_17">L1 Lesson 17: Verbs & Subject Pronouns</option>
                <option value="L1_18">L1 Lesson 18: Conjugations & Need</option>
                <option value="L1_19">L1 Lesson 19: Present Tense & Ser/Estar</option>
                <option value="L1_20">L1 Lesson 20: Nationalities & Object Pronouns</option>
            </optgroup>
            <optgroup label="Level 2">
                <option value="L2_12">L2 Lesson 12: Commands & Adverbs</option>
                <option value="L2_13">L2 Lesson 13: Days & Well/Very Well</option>
                <option value="L2_14">L2 Lesson 14: Demonstratives & Nouns</option>
                <option value="L2_15">L2 Lesson 15: "We" Forms & Prepositions</option>
                <option value="L2_16">L2 Lesson 16: Numbers, Rooms & Greetings</option>
                <option value="L2_17">L2 Lesson 17: Giving & Indirect Pronouns</option>
                <option value="L2_18">L2 Lesson 18: Formal Address & Thinking/Starting</option>
                <option value="L2_19">L2 Lesson 19: Liking & Types</option>
                <option value="L2_20">L2 Lesson 20: Ability, Returning & Reflexives</option>
            </optgroup>
        </select>

        <div class="stats">
            <div class="stat-box">Streak: 🔥 <span id="streak-count">0</span></div>
            <div class="stat-box">Score: ⭐ <span id="score-count">0</span></div>
        </div>
    </div>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="quiz-body">
        <div class="question-card">
            <span class="question-tag" id="lesson-tag">Level 1 - Lesson 11</span>
            <div class="question-text" id="question-text">Loading prompt...</div>
            
            <div class="input-container">
                <textarea id="user-answer" class="user-input" placeholder="Type the full Spanish translation here..." autocomplete="off"></textarea>
                <button id="submit-btn" class="submit-btn" onclick="checkAnswer()">Submit Translation</button>
            </div>

            <div class="explanation" id="explanation"></div>
        </div>

        <div class="footer-nav">
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Sentence ➔</button>
        </div>
    </div>

    <div class="results-screen" id="results-screen">
        <h2>Assessment Completed! 🎉</h2>
        <p>Your Final Result:</p>
        <div class="score-circle" id="final-score">0%</div>
        <p id="results-feedback">Great effort! Keep practicing.</p>
        <button class="restart-btn" onclick="restartQuiz()">Try Again 🔄</button>
    </div>
</div>

<script>
// FULL SENTENCE TRANSLATION QUESTION BANK (LEVEL 1 & LEVEL 2)
// Array of valid answers accepts optional pronouns (yo, tú, él, ella), vocabulary variations (ordenador vs computadora, coche vs carro), and word order permutations.
const rawQuestions = [
    // LEVEL 1 - LESSON 11[span_0](start_span)[span_0](end_span)
    {
        level: 1, lesson: 11,
        prompt: "Translate into Spanish: \"Do you know why I don't have it?\"",
        answers: ["¿Sabes por qué no lo tengo?", "Sabes por que no lo tengo?", "Sabes por que no lo tengo", "Sabes porque no lo tengo"],
        exp: "Lesson 11 pattern: '¿Sabes por qué no lo tengo?[span_1](start_span)'[span_1](end_span) (Subject pronoun 'tú' is optional)."
    },
    {
        level: 1, lesson: 11,
        prompt: "Translate into Spanish: \"I don't know where your phone is, but I know where your computer is.\"",
        answers: [
            "No sé dónde está tu teléfono, pero sé dónde está tu ordenador.",
            "No sé dónde está tu teléfono, pero sé dónde está tu computadora.",
            "No se donde esta tu telefono pero se donde esta tu ordenador",
            "No se donde esta tu telefono pero se donde esta tu computadora",
            "Yo no sé dónde está tu teléfono, pero sé dónde está tu computadora.",
            "Yo no sé dónde está tu teléfono, pero sé dónde está tu ordenador."
        ],
        exp: "Lesson 11 standard transcript phrasing[span_2](start_span)[span_2](end_span) accepts both 'ordenador' (ES) and 'computadora' (AmL)."
    },

    // LEVEL 1 - LESSON 12[span_3](start_span)[span_3](end_span)
    {
        level: 1, lesson: 12,
        prompt: "Translate into Spanish: \"Can I know where you are now?\"",
        answers: ["¿Puedo saber dónde estás ahora?", "Puedo saber donde estas ahora?", "Puedo saber donde estas ahora"],
        exp: "'Puedo saber dónde estás ahora?' combines 'puedo saber' + 'dónde estás' + 'ahora[span_4](start_span)'[span_4](end_span)."
    },
    {
        level: 1, lesson: 12,
        prompt: "Translate into Spanish: \"Do you know where the big computer is?\"",
        answers: [
            "¿Sabes dónde está el ordenador grande?",
            "¿Sabes dónde está la computadora grande?",
            "Sabes donde esta el ordenador grande?",
            "Sabes donde esta la computadora grande?",
            "Sabes donde esta el ordenador grande",
            "Sabes donde esta la computadora grande"
        ],
        exp: "Lesson 12 translation: '¿Sabes dónde está el ordenador / la computadora grande?[span_5](start_span)'[span_5](end_span)"
    },

    // LEVEL 1 - LESSON 13[span_6](start_span)[span_6](end_span)
    {
        level: 1, lesson: 13,
        prompt: "Translate into Spanish: \"I'm sorry but I'm very busy now.\" (Male speaker)",
        answers: ["Lo siento pero estoy muy ocupado ahora.", "Lo siento, pero estoy muy ocupado ahora.", "Lo siento pero estoy muy ocupado ahora"],
        exp: "Male speaker uses masculine ending: 'ocupado[span_7](start_span)'[span_7](end_span)."
    },
    {
        level: 1, lesson: 13,
        prompt: "Translate into Spanish: \"I don't want to do it like that because it's very difficult.\"",
        answers: [
            "No quiero hacerlo así porque es muy difícil.",
            "No quiero hacerlo asi porque es muy dificil",
            "Yo no quiero hacerlo así porque es muy difícil."
        ],
        exp: "Lesson 13 phrasing: 'No quiero hacerlo así porque es muy difícil.[span_8](start_span)'[span_8](end_span)"
    },

    // LEVEL 1 - LESSON 14[span_9](start_span)[span_9](end_span)
    {
        level: 1, lesson: 14,
        prompt: "Translate into Spanish: \"Do you want to leave tonight or tomorrow?\"",
        answers: ["¿Quieres salir esta noche o mañana?", "Quieres salir esta noche o mañana?", "Quieres salir esta noche o mañana"],
        exp: "'Esta noche' = tonight, 'mañana' = tomorrow[span_10](start_span)[span_10](end_span)."
    },
    {
        level: 1, lesson: 14,
        prompt: "Translate into Spanish: \"I want to do it tonight because I'm busy now.\"",
        answers: [
            "Quiero hacerlo esta noche porque estoy ocupado ahora.",
            "Quiero hacerlo esta noche porque estoy ocupada ahora.",
            "Quiero hacerlo esta noche porque estoy ocupado/a ahora.",
            "Quiero hacerlo esta noche porque estoy ocupado ahora",
            "Quiero hacerlo esta noche porque estoy ocupada ahora"
        ],
        exp: "Lesson 14 sentence: 'Quiero hacerlo esta noche porque estoy ocupado/a ahora.[span_11](start_span)'[span_11](end_span)"
    },

    // LEVEL 1 - LESSON 15[span_12](start_span)[span_12](end_span)
    {
        level: 1, lesson: 15,
        prompt: "Translate into Spanish: \"I can't have dinner because I am very busy.\"",
        answers: [
            "No puedo cenar porque estoy muy ocupado.",
            "No puedo cenar porque estoy muy ocupada.",
            "No puedo cenar porque estoy muy ocupado/a.",
            "No puedo cenar porque estoy muy ocupado",
            "No puedo cenar porque estoy muy ocupada"
        ],
        exp: "'Cenar' = to have dinner[span_13](start_span)[span_13](end_span). Busy = ocupado / ocupada."
    },
    {
        level: 1, lesson: 15,
        prompt: "Translate into Spanish: \"I am sure that the house is not there.\"",
        answers: [
            "Estoy seguro que la casa no está allí.",
            "Estoy segura que la casa no está allí.",
            "Estoy seguro de que la casa no está allí.",
            "Estoy segura de que la casa no está allí.",
            "Estoy seguro que la casa no esta alli",
            "Estoy segura que la casa no esta alli"
        ],
        exp: "Lesson 15 translation: 'Estoy seguro que la casa no está allí.[span_14](start_span)'[span_14](end_span)"
    },

    // LEVEL 1 - LESSON 16[span_15](start_span)[span_15](end_span)
    {
        level: 1, lesson: 16,
        prompt: "Translate into Spanish: \"I'm not doing it because I'm tired.\"",
        answers: [
            "No lo hago porque estoy cansado.",
            "No lo hago porque estoy cansada.",
            "No lo hago porque estoy cansado/a.",
            "No lo hago porque estoy cansado",
            "No lo hago porque estoy cansada"
        ],
        exp: "Lesson 16 pattern: 'No lo hago porque estoy cansado/a.[span_16](start_span)'[span_16](end_span)"
    },
    {
        level: 1, lesson: 16,
        prompt: "Translate into Spanish: \"Do you know where my chair is?\"",
        answers: ["¿Sabes dónde está mi silla?", "Sabes donde esta mi silla?", "Sabes donde esta mi silla"],
        exp: "'Silla' = chair[span_17](start_span)[span_17](end_span); '¿Sabes dónde está...?' = Do you know where... is?"
    },

    // LEVEL 1 - LESSON 17[span_18](start_span)[span_18](end_span)
    {
        level: 1, lesson: 17,
        prompt: "Translate into Spanish: \"Do you know that I am doing it today?\"",
        answers: ["¿Sabes que lo hago hoy?", "Sabes que lo hago hoy?", "Sabes que lo hago hoy"],
        exp: "Lesson 17 translation: '¿Sabes que lo hago hoy?[span_19](start_span)'[span_19](end_span)"
    },
    {
        level: 1, lesson: 17,
        prompt: "Translate into Spanish: \"Carlos is in the house.\"",
        answers: ["Carlos está en la casa.", "Carlos esta en la casa", "Carlos esta en la casa."],
        exp: "'Carlos está en la casa.' uses 'estar' for location[span_20](start_span)[span_20](end_span)."
    },

    // LEVEL 1 - LESSON 18[span_21](start_span)[span_21](end_span)
    {
        level: 1, lesson: 18,
        prompt: "Translate into Spanish: \"Why are you leaving now?\"",
        answers: ["¿Por qué sales ahora?", "Por que sales ahora?", "Por que sales ahora"],
        exp: "Present tense of salir for 'tú': 'sales[span_22](start_span)'[span_22](end_span)."
    },
    {
        level: 1, lesson: 18,
        prompt: "Translate into Spanish: \"He doesn't have a computer.\"",
        answers: [
            "Él no tiene un ordenador.",
            "Él no tiene una computadora.",
            "No tiene un ordenador.",
            "No tiene una computadora.",
            "El no tiene un ordenador",
            "El no tiene una computadora",
            "No tiene un ordenador",
            "No tiene una computadora"
        ],
        exp: "Lesson 18: 'No tiene un ordenador / una computadora.[span_23](start_span)'[span_23](end_span)"
    },

    // LEVEL 1 - LESSON 19[span_24](start_span)[span_24](end_span)
    {
        level: 1, lesson: 19,
        prompt: "Translate into Spanish: \"She sees that it's impossible for me.\"",
        answers: [
            "Ella ve que es imposible para mí.",
            "Ella ve que es imposible para mi.",
            "Ve que es imposible para mí.",
            "Ve que es imposible para mi.",
            "Ve que es imposible para mi"
        ],
        exp: "Lesson 19: '(Ella) ve que es imposible para mi.[span_25](start_span)'[span_25](end_span)"
    },
    {
        level: 1, lesson: 19,
        prompt: "Translate into Spanish: \"She can leave when she wants.\"",
        answers: [
            "Puede salir cuando quiere.",
            "Ella puede salir cuando quiere.",
            "Puede salir cuando ella quiere.",
            "Puede salir cuando quiere"
        ],
        exp: "Lesson 19: 'Puede salir cuando quiere.[span_26](start_span)'[span_26](end_span)"
    },

    // LEVEL 1 - LESSON 20[span_27](start_span)[span_27](end_span)
    {
        level: 1, lesson: 20,
        prompt: "Translate into Spanish: \"Why can't you tell me now?\"",
        answers: ["¿Por qué no puedes decirme ahora?", "Por que no puedes decirme ahora?", "Por que no puedes decirme ahora"],
        exp: "Lesson 20: '¿Por qué no puedes decirme ahora?[span_28](start_span)'[span_28](end_span)"
    },
    {
        level: 1, lesson: 20,
        prompt: "Translate into Spanish: \"She wants to tell me.\"",
        answers: [
            "Ella quiere decirme.",
            "Quiere decirme.",
            "Ella quiere decirme",
            "Quiere decirme"
        ],
        exp: "Lesson 20: '(Ella) quiere decirme.[span_29](start_span)'[span_29](end_span)"
    },

    // LEVEL 2 - LESSON 12
    {
        level: 2, lesson: 12,
        prompt: "Translate into Spanish: \"Call me tomorrow!\"",
        answers: ["¡Llámame mañana!", "Llamame mañana!", "Llamame mañana", "Llamame manana"],
        exp: "Informal imperative of llamar with pronoun: 'Llámame'."
    },
    {
        level: 2, lesson: 12,
        prompt: "Translate into Spanish: \"I want to do it quickly.\"",
        answers: ["Quiero hacerlo rápido.", "Quiero hacerlo rapido", "Yo quiero hacerlo rápido."],
        exp: "'Rápido' functions as an adverb for quickly."
    },

    // LEVEL 2 - LESSON 13
    {
        level: 2, lesson: 13,
        prompt: "Translate into Spanish: \"He speaks Spanish very well.\"",
        answers: [
            "Él habla español muy bien.",
            "El habla espanol muy bien",
            "Habla español muy bien.",
            "Habla espanol muy bien"
        ],
        exp: "'Muy bien' = very well."
    },
    {
        level: 2, lesson: 13,
        prompt: "Translate into Spanish: \"I have to leave on Monday.\"",
        answers: ["Tengo que salir el lunes.", "Tengo que salir el lunes", "Tengo que irme el lunes."],
        exp: "'El lunes' translates 'on Monday' when scheduling actions."
    },

    // LEVEL 2 - LESSON 14
    {
        level: 2, lesson: 14,
        prompt: "Translate into Spanish: \"This man wants to buy that house.\"",
        answers: [
            "Este hombre quiere comprar esa casa.",
            "Este hombre quiere comprar esa casa",
            "Este hombre quiere comprar aquella casa."
        ],
        exp: "'Este hombre' = this man; 'esa casa' = that house."
    },

    // LEVEL 2 - LESSON 15
    {
        level: 2, lesson: 15,
        prompt: "Translate into Spanish: \"We want to have dinner here tonight.\"",
        answers: [
            "Queremos cenar aquí esta noche.",
            "Nosotros queremos cenar aquí esta noche.",
            "Queremos cenar aqui esta noche",
            "Nosotros queremos cenar aqui esta noche"
        ],
        exp: "'Queremos' is 1st person plural for querer."
    },

    // LEVEL 2 - LESSON 16
    {
        level: 2, lesson: 16,
        prompt: "Translate into Spanish: \"I have three computers in my house.\"",
        answers: [
            "Tengo tres ordenadores en mi casa.",
            "Tengo tres computadoras en mi casa.",
            "Yo tengo tres ordenadores en mi casa.",
            "Yo tengo tres computadoras en mi casa.",
            "Tengo tres ordenadores en mi casa",
            "Tengo tres computadoras en mi casa"
        ],
        exp: "'Tres' = three; 'en mi casa' = in my house."
    },

    // LEVEL 2 - LESSON 17
    {
        level: 2, lesson: 17,
        prompt: "Translate into Spanish: \"Can you give me the telephone?\"",
        answers: [
            "¿Puedes darme el teléfono?",
            "Puedes darme el telefono?",
            "¿Me puedes dar el teléfono?",
            "Me puedes dar el telefono?",
            "Puedes darme el telefono"
        ],
        exp: "Either attached pronoun 'darme' or preposed 'me puedes dar'."
    },

    // LEVEL 2 - LESSON 18
    {
        level: 2, lesson: 18,
        prompt: "Translate into Spanish (Formal): \"Where are you going to start, sir?\"",
        answers: [
            "¿Dónde va a empezar, señor?",
            "Donde va a empezar señor?",
            "¿Dónde va a empezar usted, señor?",
            "Donde va a empezar usted señor?"
        ],
        exp: "Uses formal 'usted' conjugation (va a empezar)."
    },

    // LEVEL 2 - LESSON 19
    {
        level: 2, lesson: 19,
        prompt: "Translate into Spanish: \"I would like to know what kind of car you have.\"",
        answers: [
            "Me gustaría saber qué tipo de coche tienes.",
            "Me gustaría saber qué tipo de carro tienes.",
            "Me gustaria saber que tipo de coche tienes",
            "Me gustaria saber que tipo de carro tienes",
            "Me gustaría saber qué tipo de coche tiene.",
            "Me gustaría saber qué tipo de carro tiene."
        ],
        exp: "'Me gustaría' = I would like; 'qué tipo de' = what kind of."
    },

    // LEVEL 2 - LESSON 20
    {
        level: 2, lesson: 20,
        prompt: "Translate into Spanish: \"I can't get up early today.\"",
        answers: [
            "No puedo levantarme temprano hoy.",
            "No me puedo levantar temprano hoy.",
            "No puedo levantarme temprano hoy",
            "No me puedo levantar temprano hoy"
        ],
        exp: "Reflexive verb 'levantarse' combined with modal verb 'poder'."
    }
];

// STATE MANAGEMENT
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let streak = 0;

// WEB AUDIO SYNTHESIZER
let audioCtx = null;

function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

function playSound(type) {
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, ctx.currentTime);
            osc.frequency.setValueAtTime(174.61, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        }
    } catch(e) {}
}

// INITIALIZATION & FILTERING
function filterQuestions() {
    const selected = document.getElementById('lesson-select').value;
    if (selected === 'all') {
        currentQuestions = [...rawQuestions];
    } else {
        const [lvl, lsn] = selected.split('_');
        currentQuestions = rawQuestions.filter(q => q.level === parseInt(lvl.replace('L','')) && q.lesson === parseInt(lsn));
    }
    
    currentQuestions.sort(() => Math.random() - 0.5);
    restartQuiz();
}

function restartQuiz() {
    currentIndex = 0;
    score = 0;
    streak = 0;
    document.getElementById('score-count').textContent = score;
    document.getElementById('streak-count').textContent = streak;
    document.getElementById('results-screen').style.display = 'none';
    document.getElementById('quiz-body').style.display = 'block';
    showQuestion();
}

function showQuestion() {
    const qData = currentQuestions[currentIndex];
    
    document.getElementById('lesson-tag').textContent = `Level ${qData.level} - Lesson ${qData.lesson}`;
    document.getElementById('question-text').innerText = qData.prompt;
    document.getElementById('explanation').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    
    const inputField = document.getElementById('user-answer');
    const submitBtn = document.getElementById('submit-btn');
    inputField.value = '';
    inputField.disabled = false;
    inputField.className = 'user-input';
    submitBtn.disabled = false;
    submitBtn.style.display = 'block';

    setTimeout(() => inputField.focus(), 100);

    // Enter key submits sentence (Shift+Enter allows multiline if desired)
    inputField.onkeydown = function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            checkAnswer();
        }
    };
    
    const progressPct = (currentIndex / currentQuestions.length) * 100;
    document.getElementById('progress-bar').style.width = `${progressPct}%`;
}

// STRING NORMALIZATION UTILITY FOR ACCENT/PUNCTUATION FLEXIBILITY
function normalizeString(str) {
    return str
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // removes accents
        .replace(/[¿?¡!.,\/#$%\^&\*;:{}=\-_`~()]/g, "") // removes punctuation
        .replace(/\s+/g, " ") // normalizes spaces
        .trim();
}

function checkAnswer() {
    const qData = currentQuestions[currentIndex];
    const inputField = document.getElementById('user-answer');
    const submitBtn = document.getElementById('submit-btn');
    const userVal = normalizeString(inputField.value);
    
    if (!userVal) return;

    inputField.disabled = true;
    submitBtn.style.display = 'none';

    // Flexible string match against any accepted variations
    const isCorrect = qData.answers.some(ans => normalizeString(ans) === userVal);

    if (isCorrect) {
        inputField.classList.add('correct');
        score++;
        streak++;
        playSound('correct');
    } else {
        inputField.classList.add('incorrect');
        streak = 0;
        playSound('error');
    }

    document.getElementById('score-count').textContent = score;
    document.getElementById('streak-count').textContent = streak;

    const expBox = document.getElementById('explanation');
    
    // Primary target answer display
    let acceptedHtml = `<ul class="accepted-list">`;
    const primaryAns = qData.answers[0];
    acceptedHtml += `<li><strong>Target Translation:</strong> ${primaryAns}</li>`;
    acceptedHtml += `</ul>`;

    expBox.innerHTML = `<div><strong>Correction & Guidance:</strong></div>${acceptedHtml}<div style="margin-top:8px;">💡 ${qData.exp}</div>`;
    expBox.style.display = 'block';

    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        showQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quiz-body').style.display = 'none';
    document.getElementById('progress-bar').style.width = '100%';
    
    const resultsScreen = document.getElementById('results-screen');
    const finalPct = Math.round((score / currentQuestions.length) * 100);
    
    document.getElementById('final-score').textContent = `${finalPct}%`;
    
    let feedback = "";
    if (finalPct === 100) feedback = "¡Increíble! Perfect full-sentence translations! 🌟";
    else if (finalPct >= 80) feedback = "¡Excelente! Outstanding translation proficiency! 👏";
    else if (finalPct >= 60) feedback = "Good effort! Review sentence construction and word order. 👍";
    else feedback = "Keep practicing! Full sentence translation takes time to master. 📚";
    
    document.getElementById('results-feedback').textContent = feedback;
    resultsScreen.style.display = 'block';

    if (finalPct >= 80) {
        triggerConfetti();
    }
}

function triggerConfetti() {
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;

    const pieces = [];
    const colors = ['#4A90E2', '#2ECC71', '#E74C3C', '#F1C40F', '#9B59B6'];

    for (let i = 0; i < 80; i++) {
        pieces.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 8 + 4,
            speed: Math.random() * 3 + 2
        });
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
            p.y += p.speed;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });

        if (pieces.some(p => p.y < canvas.height)) {
            requestAnimationFrame(animate);
        }
    }
    animate();
}

// Start Quiz on load
filterQuestions();
</script>
